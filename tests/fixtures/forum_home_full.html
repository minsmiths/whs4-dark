<!--
    구조를 흉내 낸 샘플 포럼 홈페이지 fixture (통합 테스트용). 실제 대상 사이트의 원문이 아니다.
    nav + 규칙 페이지 링크 + 페이지네이션 통계 영역을 한 페이지에 모아 investigate.py의
    run_pipeline() 전체(①~⑦)를 로컬 fixture만으로 검증하는 데 쓴다.

    "General Discussion"은 forum_thread_list.html(실제 게시글이 있는 목록 페이지)을 가리킨다 —
    content_sample.crawl_site()가 홈페이지 nav에서 카테고리를 찾아 실제로 들어가서 헤드라인을
    모으는 동작(2026-08-23 도입)을 E2E로 검증하기 위해서다. "Market"은 일부러 존재하지 않는
    경로를 가리켜서 "카테고리 접속 실패, 건너뜀" 경로(크롤링이 죽지 않아야 함)도 같이 검증한다.
-->
<html lang="ko">
<head><title>Sample Forum (full)</title></head>
<body>
  <nav>
    <a href="forum_thread_list.html">General Discussion</a>
    <a href="/categories/market">Market</a>
    <a href="forum_rules.html">Rules &amp; FAQ</a>
  </nav>
  <form action="/register" method="post">
    <input type="text" name="username" placeholder="아이디" />
    <input type="password" name="password" placeholder="비밀번호" />
  </form>
  <ul class="pagination">
    <li><a href="?page=1">1</a></li>
    <li><a href="?page=7">7</a></li>
  </ul>
</body>
</html>
