name: security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-safety-checks:
    runs-on: ubuntu-latest
    # docs/security-checklist.md 의 "CI" 표시 항목 중 코드 grep 으로 자동화 가능한 부분.
    # 나머지(격리 자격증명, Tor 포트 바인딩, 세션 재사용 등)는 컨테이너 런타임이 필요해
    # M6/실사이트 검증 시점에 사람이 수동으로 확인한다.
    steps:
      - uses: actions/checkout@v4

      - name: 브라우저 샌드박스 비활성화 플래그 금지 (CLAUDE.md §4.2-1)
        # 주석에서 "이 플래그를 쓰지 말라"고 설명하는 것 자체는 허용해야 하므로,
        # 실제 코드로 쓰인 경우만 잡기 위해 '#'으로 시작하는 줄(주석)은 제외한다.
        run: |
          if grep -rn --include='*.py' --include='Dockerfile' -- \
              '--no-sandbox\|--disable-setuid-sandbox' . \
              | grep -v -E '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "::error::--no-sandbox / --disable-setuid-sandbox 사용 금지 (CLAUDE.md §4.2-1)"
            exit 1
          fi

      - name: 결과물 경계 — output/ 밖에서 아웃바운드 전송 함수 금지 (§3 준수사항, 산출물은 MD 1개)
        run: |
          if grep -rn -E 'requests\.post|smtplib|socket\.send' \
              --include='*.py' . \
              | grep -v '^\./tests/'; then
            echo "::error::output/ 반출 경로 밖에서 아웃바운드 전송 함수 호출이 발견됨"
            exit 1
          fi

      - name: 파일 다운로드 금지 (§3-5 — 존재 여부만 기록, 다운로드하지 않음)
        run: |
          if grep -rn -E 'urlretrieve|iter_content|shutil\.copyfileobj' \
              --include='*.py' . \
              | grep -v '^\./tests/'; then
            echo "::error::파일 다운로드 관련 호출이 발견됨 (§3-5 위반 가능성)"
            exit 1
          fi
